<!doctype html>
<meta charset="utf-8">
<title>THE DJ'S DESK - offline levels</title>
<!--
  THE DJ'S DESK (lane DJFX): render a few seconds of a hero-like mix through createFxBus in an OfflineAudioContext,
  for several moods and every overdo, and report the peak and RMS. Driven by tools/djfx_levels.py (headless Chromium).
  The master chain here copies engine.js build(): master 0.8 -> limiter (-14 dB, knee 4, ratio 20, attack 2 ms,
  release 0.2 s) -> safety 0.9 -> the speakers. "bus" levels are the desk's own output with no master chain at all.
-->
<script type="module">
import { truePeak } from './truepeak.js';
import { createFxBus, moodOf, settleFlavour, fxValues } from '../src/dj-fx.js';
import { loadColour } from '../src/dj-colour.js';

// OVERDRIVE's valve loads on demand (lane DJOVERDRIVE); load it first, as the symphony does, so every render has it
await loadColour();

const SR = 48000;
// the master gain (lane VOLUMEFULL): ?gain= in the URL, 0.8 by default as before. The engine's gain is the level
// squared (levelGain), so the fresh level 1.0 is gain 1.0 and the old fresh level 0.8 was gain 0.64.
const MASTER_GAIN = Number(new URLSearchParams(location.search).get('gain') ?? 0.8);
const SECS = 8;

// a hero-like source: a pad chord, a flute-like lead (peak about 0.22, settle-hear's INST_PEAK) and a soft kick
function source(ctx, out) {
  const t0 = 0.05;
  const pad = ctx.createGain(); pad.gain.value = 0.05; pad.connect(out);
  for (const f of [196, 246.9, 293.7]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(pad); o.start(t0); }
  const notes = [587.3, 659.3, 784, 659.3, 587.3, 523.3, 587.3, 784];
  for (let i = 0; i < SECS * 2; i++) {
    const t = t0 + i * 0.5;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = notes[i % notes.length];
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.5);
    const k = ctx.createOscillator(); k.frequency.setValueAtTime(120, t); k.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const kg = ctx.createGain(); kg.gain.setValueAtTime(0.4, t); kg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    k.connect(kg); kg.connect(out); k.start(t); k.stop(t + 0.3);
  }
}

function masterChain(ctx) {
  const master = ctx.createGain(); master.gain.value = MASTER_GAIN;
  const limit = ctx.createDynamicsCompressor();
  limit.threshold.value = -14; limit.knee.value = 4; limit.ratio.value = 20; limit.attack.value = 0.002; limit.release.value = 0.2;
  const safety = ctx.createGain(); safety.gain.value = 0.9;
  master.connect(limit); limit.connect(safety); safety.connect(ctx.destination);
  return master;
}

const db = (x) => (x > 0 ? 20 * Math.log10(x) : -Infinity);
function levels(buf, from = 0) {
  let peak = 0; let sum = 0; let n = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = Math.floor(from * SR); i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i] * d[i]; n++; }
  }
  const tp = truePeak(buf, from); // the 4x oversampled peak between samples (lane VOLUMEFULL)
  return { peak: +peak.toFixed(4), peakDb: +db(peak).toFixed(2), rmsDb: +db(Math.sqrt(sum / n)).toFixed(2), truePeak: +tp.toFixed(4), truePeakDb: +db(tp).toFixed(2) };
}

async function render(values, { master = true } = {}) {
  const ctx = new OfflineAudioContext(2, SR * SECS, SR);
  const out = master ? masterChain(ctx) : ctx.destination;
  let into = out;
  if (values) {
    const bus = createFxBus({ ctx, master: out });
    bus.apply(values, 0, { tau: 0.05, beatDur: 0.5 });
    into = bus.input;
  }
  const ch = ctx.createGain(); ch.gain.value = 0.55; ch.connect(into);
  source(ctx, ch);
  const buf = await ctx.startRendering();
  return levels(buf, 1);
}

const hot = settleFlavour({ heat: 0.95, flips: 0.9, energy: 0.9, overlap: 0.05 });
const mid = settleFlavour({ heat: 0.5, flips: 0.5, energy: 0.5, overlap: 0.5 });
const cold = settleFlavour({ heat: 0.05, flips: 0.05, energy: 0.1, overlap: 0.95 });
const cases = [
  ['no bus (the old path)', null],
  ['CLEAN, cold', fxValues('clean', cold)],
  ['WARM ROOM, mid', fxValues('warm-room', mid)],
  ['DUB ECHO, mid', fxValues('dub-echo', mid)],
  ['CATHEDRAL, cold', fxValues('cathedral', cold)],
  ['OVERDRIVE (GRIT refitted, lane DJOVERDRIVE), hot', fxValues('overdrive', hot)],
  ['UNDERWATER, mid', fxValues('underwater', mid)],
  ['DUB ECHO · too much delay', fxValues('dub-echo', mid, 'delay')],
  ['CATHEDRAL · too much reverb', fxValues('cathedral', cold, 'reverb')],
  ['OVERDRIVE · too much distortion', fxValues('overdrive', hot, 'drive')],
  ['WARM ROOM · too much distortion (fold)', fxValues('warm-room', mid, 'drive')],
];
const rows = [];
for (const [name, v] of cases) rows.push({ name, master: await render(v), bus: await render(v, { master: false }) });
window.__result = { gain: MASTER_GAIN, rows };
document.body.textContent = JSON.stringify(rows, null, 1);
</script>
